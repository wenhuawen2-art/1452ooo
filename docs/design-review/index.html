<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>向野 · 设计对照与层级</title><style>*{box-sizing:border-box}body{margin:0;background:#edf1f5;color:#17212c;font:14px/1.5 system-ui}header{height:64px;padding:16px 24px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:24px}h1{font-size:20px;margin:0}a{color:#007bff}main{display:grid;grid-template-columns:210px minmax(440px,1fr) 340px;height:calc(100vh - 64px)}aside{overflow:auto;padding:16px;background:#fff9}button{cursor:pointer;border:1px solid #d4dce5;background:#fff;border-radius:8px;padding:8px 12px;color:inherit}.pages button{display:block;text-align:left;width:100%;margin-bottom:8px}.pages button.active{background:#007bff;color:#fff}.center{overflow:auto;padding:20px}.tools{position:sticky;top:-20px;z-index:2;background:#edf1f5;padding:12px 0;display:flex;gap:12px;align-items:center}.pictures{display:flex;gap:16px;justify-content:center;align-items:flex-start}.pictures figure{margin:0;width:393px;flex-shrink:0}.pictures img{width:100%;display:block}.pictures figcaption{padding:8px;font-weight:600}.pictures.overlay{position:relative;width:393px;margin:auto}.overlay figure:last-child{position:absolute;top:0;left:0;opacity:var(--opacity,.5)}pre{white-space:pre-wrap;word-break:break-all;background:#17212c;color:#edf1f5;padding:12px;border-radius:8px;font-size:12px}#tree{max-height:45vh;overflow:auto}#tree button{display:block;text-align:left;width:100%;border:0;border-bottom:1px solid #edf1f5;border-radius:0;font-size:12px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:6px;border-bottom:1px solid #ccd5df;text-align:left}.rule{margin:8px 0}small{color:#64748b}.notice{padding:10px;border-left:3px solid #438fe8;background:white}input{width:100%}@media(max-width:1100px){main{grid-template-columns:160px 1fr}.inspect{display:none}.pictures{justify-content:flex-start}}</style><header><h1>向野 · 最新设计审查</h1><span>14 张画板 / 393px 基准</span><a href="/?mode=latest-166-14296" target="_blank">手机样机</a></header><main><aside class="pages" id="pages"></aside><section class="center"><div class="tools"><button id="mode">切换叠加对照</button><label>实现透明度 <input id="alpha" type="range" min="0" max="100" value="50"></label><a id="preview" target="_blank">操作预览 ↗</a></div><p id="meta" class="notice"></p><div id="pictures" class="pictures"><figure><figcaption>MasterGo 最新原稿</figcaption><img id="ref"></figure><figure><figcaption>本地实现</figcaption><img id="actual"></figure></div></section><aside class="inspect"><h3>节点层级 · 原稿实测</h3><small>点击节点，查看字号、字重、间距和视觉属性。</small><select id="layerSource"><option value="design">原稿节点</option><option value="actual">实现节点（浏览器实测）</option></select><div id="tree"></div><pre id="detail">选择一个节点</pre><details open><summary><b>统一文字与间距规则</b></summary><div id="rules"></div></details></aside></main><script>fetch('data.json').then(r=>r.json()).then(({pages,rules})=>{const $=x=>document.getElementById(x);let selected;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(p){selected=p;$('ref').src='references/'+p.key+'.png';$('actual').src='implemented/'+p.key+'.png';$('preview').href=p.preview;$('meta').textContent=p.name+' · '+p.id+' · 393 × '+p.height+'。'+p.notes;[...$('pages').children].forEach((e,i)=>e.classList.toggle('active',pages[i]===p));$('tree').replaceChildren(...($('layerSource').value==='actual'?p.actualNodes:p.nodes).map(n=>{let b=document.createElement('button');b.style.paddingLeft=Math.min(n.depth,10)*10+8+'px';b.textContent=(n.text?'T ':'▸ ')+(n.text||n.name||n.id);b.onclick=()=>$('detail').textContent=JSON.stringify({id:n.id,name:n.name,text:n.text,...n.style},null,2);return b}));$('detail').textContent=p.background;history.replaceState(null,'','#'+p.key)}$('pages').replaceChildren(...pages.map(p=>{let b=document.createElement('button');b.textContent=p.name;b.onclick=()=>show(p);return b}));$('layerSource').onchange=()=>show(selected);$('mode').onclick=()=>$('pictures').classList.toggle('overlay');$('alpha').oninput=e=>$('pictures').style.setProperty('--opacity',e.target.value/100);$('rules').innerHTML='<p>底色 '+rules.base+' · 正文 '+rules.ink+'</p><p>间距 '+rules.spacing.join(' / ')+'px</p>'+rules.layout.map(x=>'<p class="rule">'+esc(x)+'</p>').join('')+'<table><tr><th>层级</th><th>字号/行高</th><th>字重</th></tr>'+rules.typography.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[2]+'/'+x[3]+'</td><td>'+x[4]+'</td></tr>').join('')+'</table>';show(pages.find(p=>p.key===location.hash.slice(1))||pages[0])})</script></html>

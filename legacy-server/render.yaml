# Deployment template only. Creating this service in Render incurs hosting and disk charges.
services:
  - type: web
    name: suixing-roadtrip
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.21.1
      - key: DATA_DIR
        value: /var/data
    disk:
      name: suixing-data
      mountPath: /var/data
      sizeGB: 1
